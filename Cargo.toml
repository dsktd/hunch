[package]
name = "hunch"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "Hunch: a party trivia game for the big screen, with phones as answer pads and questions made on the fly"
repository = "https://github.com/dsktd/hunch"
readme = "README.md"
keywords = ["game", "trivia", "party"]
categories = ["games"]

[dependencies]
rand = "0.9"
strsim = "0.11" # edit distance for bluff answers
unicode-normalization = "0.1" # accent folding for answer matching

# PHONES (the transport follows Gobble Grand Prix's src/phone.rs)
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] } # https://github.com/tokio-rs/axum
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] } # https://github.com/programatik29/axum-server
dirs = "6"
futures-util = "0.3"
iroh = "1.3" # https://github.com/n0-computer/iroh
qrcode = { version = "0.14.1", default-features = false } # https://github.com/kennytm/qrcode-rust
rcgen = { version = "0.14.1", default-features = false, features = ["crypto", "pem", "ring"] } # https://github.com/rustls/rcgen
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "io-util"] }

# QUESTIONS FROM CLAUDE (optional, only with ANTHROPIC_API_KEY)
ureq = { version = "3", default-features = false, features = ["rustls"] } # https://github.com/algesten/ureq

[profile.dev]
opt-level = 1
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = 'abort'
strip = true

# Fast iterative Deck builds; release stays for CI and tags
[profile.deck-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# The iroh and axum trees pull several versions of the same crate; not ours to fix.
multiple_crate_versions = "allow"
# Bevy systems take Res/Query/Commands parameters by value; the signature is the API.
needless_pass_by_value = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
# Scores, timers and layout are small bounded numbers; these casts are deliberate.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
suboptimal_flops = "allow"
# Screen-building systems are long straight-line spawn code.
too_many_lines = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
trivially_copy_pass_by_ref = "allow"
# The library is the game's own; #[must_use] and error docs on every pub fn add noise for no reader.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Sets of used question keys are always the std hasher.
implicit_hasher = "allow"
